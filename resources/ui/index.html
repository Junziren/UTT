<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UTT</title>
<link rel="stylesheet" href="utt.css">
<script src="utt.js" defer></script>
</head>
<body>
<div class="app" id="app">

  <header class="osbar">
    <div class="osbar-brand">
      <span class="osbar-logo">UTT</span>
      <span class="osbar-sep"></span>
      <span class="osbar-route">UTILITY TOOLBOX <span class="osbar-route-sub">/ 通道条工具</span></span>
    </div>
    <div class="osbar-right">
      <span class="osbar-manuf">UNPUREBLOOM</span>
      <button class="btn btn-text" id="btn-about" type="button">关于</button>
    </div>
  </header>

  <main class="main">

    <section class="rack">

      <div class="module" id="mod-input">
        <div class="mod-head">
          <span class="mod-index">01</span>
          <span class="mod-title">输入 · 相位</span>
          <span class="mod-tech">INPUT / PHASE</span>
        </div>
        <div class="mod-body mod-body-col" id="sec-input"></div>
      </div>

      <div class="module" id="mod-process">
        <div class="mod-head">
          <span class="mod-index">02</span>
          <span class="mod-title">处理</span>
          <span class="mod-tech">PROCESS</span>
        </div>
        <div class="mod-body mod-body-col" id="sec-process"></div>
      </div>

      <div class="module" id="mod-output">
        <div class="mod-head">
          <span class="mod-index">03</span>
          <span class="mod-title">输出</span>
          <span class="mod-tech">OUTPUT</span>
        </div>
        <div class="mod-body mod-body-col" id="sec-output"></div>
      </div>

    </section>

    <section class="module mod-measure">
      <div class="mod-head">
        <span class="mod-index">04</span>
        <span class="mod-title">测量</span>
        <span class="mod-tech">MEASUREMENT / 实时遥测</span>
      </div>
      <div class="measure-body">
        <div class="scope-well">
          <canvas id="scope" width="640" height="180"></canvas>
          <span class="well-tag">SCOPE · L/R</span>
        </div>
        <div class="meterbars">
          <div class="meterbar" id="meter-l">
            <div class="meterbar-scale">
              <span>0</span><span>-12</span><span>-24</span><span>-36</span><span>-48</span><span>-60</span>
            </div>
            <div class="meterbar-track">
              <div class="meterbar-rms"></div>
              <div class="meterbar-peak"></div>
              <div class="meterbar-hold"></div>
            </div>
            <span class="meterbar-label">L</span>
          </div>
          <div class="meterbar" id="meter-r">
            <div class="meterbar-scale">
              <span>0</span><span>-12</span><span>-24</span><span>-36</span><span>-48</span><span>-60</span>
            </div>
            <div class="meterbar-track">
              <div class="meterbar-rms"></div>
              <div class="meterbar-peak"></div>
              <div class="meterbar-hold"></div>
            </div>
            <span class="meterbar-label">R</span>
          </div>
        </div>
        <div class="measure-side">
          <div class="well corr-well">
            <div class="corr-track">
              <div class="corr-center"></div>
              <div class="corr-fill" id="corr-fill"></div>
              <div class="corr-marker" id="corr-marker"></div>
            </div>
            <div class="corr-readouts">
              <span class="corr-caption">相位相关</span>
              <output class="mono" id="corr-value">0.00</output>
            </div>
          </div>
          <div class="well lufs-well">
            <div class="lufs-row"><span class="lufs-k">M</span><output class="mono lufs-v" id="lufs-m">-70.0</output><span class="lufs-u">LUFS</span></div>
            <div class="lufs-row"><span class="lufs-k">S</span><output class="mono lufs-v" id="lufs-s">-70.0</output><span class="lufs-u">LUFS</span></div>
            <div class="lufs-row"><span class="lufs-k">I</span><output class="mono lufs-v" id="lufs-i">-70.0</output><span class="lufs-u">LUFS</span></div>
          </div>
        </div>
      </div>
    </section>

    <section class="module mod-record">
      <div class="mod-head">
        <span class="mod-index">05</span>
        <span class="mod-title">录制</span>
        <span class="mod-tech">RECORD / 24-BIT WAV</span>
      </div>
      <div class="record-body">
        <div class="record-left" id="sec-record"></div>
        <div class="record-mid">
          <button class="btn" id="btn-browse" type="button">浏览…</button>
          <output class="record-path mono" id="record-path">—</output>
        </div>
        <div class="record-right">
          <span class="record-state" id="record-state">待机</span>
          <output class="record-dropped mono" id="record-dropped"></output>
        </div>
      </div>
    </section>

  </main>

  <footer class="statusbar">
    <span class="statusbar-msg" id="status-msg">就绪</span>
    <span class="statusbar-right">
      <span id="status-engine" class="mono"></span>
      <span class="statusbar-sep"></span>
      <span class="mono">v0.3.0</span>
    </span>
  </footer>

</div>
</body>
</html>
